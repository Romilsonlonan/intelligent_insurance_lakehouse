[project]
name = "lakehouse-governance"
version = "2.0.0"
description = "Prudential Lakehouse Intelligence v2 — Event-Driven Quality Architecture"
authors = [
    {name = "Romilson Luis", email = "romilsonlonan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "pydantic (>=2.7.0,<3.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    # HTTP
    "requests (>=2.32.0,<3.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    # Data / ETL
    "pandas (>=2.2.0,<3.0.0)",
    "pyarrow (>=16.0.0,<20.0.0)",
    "duckdb (>=1.0.0,<2.0.0)",
    # Dashboard
    "dash (>=2.17.0,<3.0.0)",
    "plotly (>=5.22.0,<6.0.0)",
    # AI / LLM (Google Gemma / Gemini via LangChain 0.3 stack)
    "langchain (>=0.3.0,<1.0.0)",
    "langchain-google-genai (>=2.0.0,<3.0.0)",
    # RAG / Vector store
    "chromadb (>=0.5.0,<1.0.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    # Knowledge Graph
    "neo4j (>=5.20.0,<6.0.0)",
    # Async
    "anyio (>=4.4.0,<5.0.0)",
    # Observability
    "structlog (>=24.1.0,<25.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
